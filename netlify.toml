[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Netlify Dev Server Configuration
[dev]
  command = "npm run dev"
  port = 4321
  targetPort = 4321
  autoLaunch = false

# Custom 404 page - Must be last redirect
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Enhanced Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS - Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Frame Protection
    X-Frame-Options = "DENY"

    # MIME Type Sniffing Protection
    X-Content-Type-Options = "nosniff"

    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # XSS Protection (legacy, but still useful)
    X-XSS-Protection = "1; mode=block"

    # Content Security Policy - Optimized for Netlify & Astro
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https: blob:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' https://*.netlify.app https://*.netlify.com;
      frame-src 'self' https://www.google.com;
      base-uri 'self';
      form-action 'self' https://*.netlify.app;
      frame-ancestors 'none';
      upgrade-insecure-requests
    '''

    # Permissions Policy - Disable unused browser features
    Permissions-Policy = '''
      geolocation=(),
      microphone=(),
      camera=(),
      payment=(),
      usb=(),
      magnetometer=(),
      gyroscope=(),
      accelerometer=()
    '''

# Cache Headers for Static Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font Files Caching
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML Pages - Short Cache for Updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
